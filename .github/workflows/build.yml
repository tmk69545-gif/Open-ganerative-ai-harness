name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & build packages
        run: |
          npm install
          npm run build:packages

      - name: Run unit tests
        run: npm test

      - name: Verify harness CLI
        run: node bin/open-generative-ai.js harness detect --json

      - name: Build Next.js web app
        run: npm run build

  build-desktop:
    needs: test-and-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: electron:build:linux
          - os: windows-latest
            script: electron:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & build packages
        run: |
          npm install
          npm run build:packages

      - name: Run unit tests
        run: npm test

      - name: Build Electron desktop artifacts
        run: npm run ${{ matrix.script }}

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: Attach artifacts to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
